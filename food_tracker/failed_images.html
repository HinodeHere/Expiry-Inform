<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍏 FreshTrack - Failed Scans</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --card-bg: white; --text-color: #333; 
            --shadow: rgba(0,0,0,0.1); --border-color: #ddd;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f4f4f9; 
            --shadow: rgba(0,0,0,0.5); --border-color: #444;
        }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; transition: 0.3s; }
        
        .header-container { width: 100%; max-width: 600px; display: flex; justify-content: flex-start; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .nav-btn { padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .nav-btn:hover { background: #5a6268; }
        
        .gallery { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px var(--shadow); position: relative; transition: 0.3s;}
        img { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        
        .raw-text-box { background: var(--bg-color); color: var(--text-color); padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; white-space: pre-wrap; overflow-x: auto; margin-bottom: 10px; border: 1px solid var(--border-color); transition: 0.3s; }
        
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-delete:hover { background-color: #c82333; }
        .no-data { text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('appTheme') || 'light');</script>

    <div class="header-container">
        <a href="/" class="nav-btn">⬅ Back to Dashboard</a>
        <h2 style="margin:0;">⚠️ Failed Scans</h2>
    </div>

    <div class="gallery" id="gallery">
        <p class="no-data">Loading images...</p>
    </div>

    <script>
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (config && config.method === 'DELETE') {
                let pin = localStorage.getItem('appPin');
                if (!pin) {
                    pin = prompt("🔒 Enter App PIN to authorize this action:");
                    if (!pin) throw new Error("Action cancelled.");
                    localStorage.setItem('appPin', pin);
                }
                config.headers = { ...config.headers, 'X-App-PIN': pin };
            }
            let response = await originalFetch(resource, config);
            if (response.status === 401) {
                localStorage.removeItem('appPin');
                alert("❌ Incorrect PIN!");
            }
            return response;
        };

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            try {
                const response = await fetch('/api/failed_images');
                const data = await response.json();

                if (data.images.length === 0) {
                    gallery.innerHTML = '<p class="no-data">✅ No failed scans found! Good job.</p>';
                    return;
                }

                gallery.innerHTML = '';
                for (const file of data.images) {
                    const txtFile = file.substring(0, file.lastIndexOf('.')) + '.txt';
                    let rawText = "No text captured.";
                    try {
                        const txtResponse = await fetch(`/failed_data/${txtFile}`);
                        if (txtResponse.ok) rawText = await txtResponse.text();
                    } catch(e) {} 

                    gallery.innerHTML += `
                        <div class="card">
                            <img src="/failed_data/${file}" alt="Failed scan">
                            <strong>Raw OCR Output:</strong>
                            <div class="raw-text-box">${rawText}</div>
                            <button class="btn-delete" onclick="deleteImage('${file}')">🗑️ Delete Record</button>
                        </div>
                    `;
                }
            } catch (err) {
                gallery.innerHTML = '<p class="no-data" style="color:red;">❌ Error loading data.</p>';
            }
        }

        async function deleteImage(filename) {
            if (!confirm("Delete this image and its raw text permanently?")) return;
            const response = await fetch(`/api/failed_images/${filename}`, { method: 'DELETE' });
            if (response.ok) loadImages(); 
        }

        window.onload = loadImages;
    </script>
</body>
</html>
