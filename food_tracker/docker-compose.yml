version: '3.8'

services:
  food-tracker:
    build: .
    container_name: food_tracker_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      # We will map our Python files here later so we can edit without rebuilding
      - .:/app 
    restart: unless-stopped
    env_file:             # <-- THIS IS CRITICAL
      - .env              # <-- THIS TELLS DOCKER TO LOAD THE FILE
    environment:
      - TZ=Asia/Shanghai

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - food-tracker