<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food & Expiry Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .header-container { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .nav-btn:hover { background: #5a6268; }
        
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 20px; }
        
        .btn-scan { display: block; width: 100%; padding: 15px; background-color: #28a745; color: white; text-align: center; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-scan:hover { background-color: #218838; }
        
        label { display: block; font-weight: bold; color: #333; margin-top: 10px; margin-bottom: 5px; font-size: 14px; }
        input, select { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; background-color: white; min-height: 44px; }
        
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        #statusMessage { font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2 style="margin:0;">🛒 Add Food</h2>
        <div>
            <a href="/inventory" class="nav-btn">📦 Inventory</a>
            <a href="/failed" class="nav-btn" style="background: #dc3545; margin-left: 5px;">⚠️ Failed Scans</a>
            <a href="/analytics" class="nav-btn" style="background: #17a2b8; margin-left: 5px;">📊 Analytics</a>
        </div>
    </div>

    <div class="card">
        <label for="cameraInput" class="btn-scan">📸 Snap Photo of Expiry Label</label>
        <input type="file" id="cameraInput" accept="image/*" multiple style="display: none;">
        <div id="statusMessage"></div>
        <button id="btnReport" style="display: none; background-color: #ffc107; color: black; margin-top: 15px;" onclick="reportBadScan()">⚠️ Output Incorrect? Save Image for Review</button>
    </div>

    <div class="card" id="manualForm">
        <label>Product Name</label>
        <input list="nameHistory" type="text" id="productName" placeholder="e.g., Milk">
        <datalist id="nameHistory"></datalist>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Quantity</label>
                <input type="number" id="quantity" value="1" min="1">
            </div>
            <div style="flex: 1;">
                <label>Location (Optional)</label>
                <input list="locationHistory" type="text" id="location" placeholder="e.g., Kitchen Fridge">
                <datalist id="locationHistory">
                    <option value="Kitchen Fridge">
                    <option value="Deep Freezer">
                    <option value="Pantry Shelf">
                </datalist>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Production Date</label>
                <input type="date" id="prodDate">
            </div>
            <div style="flex: 1;">
                <label>Shelf Life (Optional)</label>
                <input type="text" id="shelfLife" placeholder="e.g., 12个月 or 7天">
            </div>
        </div>

        <label>Calculated Expiry Date</label>
        <input type="date" id="expDate">

        <button onclick="saveToDatabase()">Save to Database</button>
    </div>

    <script>
        let lastRawText = ""; // <--- NEW: Stores the raw OCR output

        // SECURITY INTERCEPTOR
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (config && (config.method === 'POST' || config.method === 'DELETE')) {
                if (!resource.includes('/api/scan') && !resource.includes('/api/report_error')) {
                    let pin = localStorage.getItem('appPin');
                    if (!pin) {
                        pin = prompt("🔒 Enter App PIN to authorize this action:");
                        if (!pin) throw new Error("Action cancelled.");
                        localStorage.setItem('appPin', pin);
                    }
                    config.headers = { ...config.headers, 'X-App-PIN': pin };
                }
            }
            let response = await originalFetch(resource, config);
            if (response.status === 401) {
                localStorage.removeItem('appPin');
                alert("❌ Incorrect PIN! Action blocked.");
            }
            return response;
        };

        const cameraInput = document.getElementById('cameraInput');
        const statusMessage = document.getElementById('statusMessage');

        window.onload = async () => {
            try {
                const resNames = await fetch('/api/product_names');
                const dataNames = await resNames.json();
                dataNames.names.forEach(name => document.getElementById('nameHistory').innerHTML += `<option value="${name}">`);

                const resLocs = await fetch('/api/locations');
                const dataLocs = await resLocs.json();
                const locList = document.getElementById('locationHistory');
                dataLocs.locations.forEach(loc => {
                    if(!locList.innerHTML.includes(`"${loc}"`)) locList.innerHTML += `<option value="${loc}">`;
                });
            } catch (e) {}
        };

        cameraInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            statusMessage.style.color = '#007bff';
            statusMessage.innerText = `⏳ Scanning ${files.length} image(s)...`;
            lastRawText = ""; // Reset text on new scan

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) formData.append('files', files[i]); 

            try {
                const response = await fetch('/api/scan', { method: 'POST', body: formData });
                const result = await response.json();

                document.getElementById('btnReport').style.display = 'block';

                if (response.ok) {
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = '✅ Scan successful! Please confirm the dates.';
                    document.getElementById('prodDate').value = result.production_date;
                    document.getElementById('shelfLife').value = result.shelf_life;
                    document.getElementById('expDate').value = result.calculated_expiration;
                    lastRawText = result.raw_text; // <--- NEW: Store the text for reporting
                    
                    if (!document.getElementById('productName').value && result.suggested_name) {
                        document.getElementById('productName').value = result.suggested_name;
                    }
                } else {
                    statusMessage.style.color = 'red';
                    statusMessage.innerText = '❌ ' + result.error;
                }
            } catch (err) {
                statusMessage.style.color = 'red';
                statusMessage.innerText = '❌ Connection failed.';
            }
        });

        async function reportBadScan() {
            const files = document.getElementById('cameraInput').files;
            if (files.length === 0) return alert("No image found to report.");
            
            const btn = document.getElementById('btnReport');
            btn.innerText = "⏳ Saving image & text...";

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) formData.append('files', files[i]);
            formData.append('raw_text', lastRawText); // <--- NEW: Attach text to payload

            try {
                const response = await fetch('/api/report_error', { method: 'POST', body: formData });
                if (response.ok) {
                    alert('✅ Image and raw text saved to Failed Scans!');
                    btn.style.display = 'none';
                    btn.innerText = "⚠️ Output Incorrect? Save Image for Review";
                } else {
                    alert('❌ Failed to save image.');
                    btn.innerText = "⚠️ Output Incorrect? Save Image for Review";
                }
            } catch (err) {
                alert('❌ Network error.');
                btn.innerText = "⚠️ Output Incorrect? Save Image for Review";
            }
        }

        function recalculateExpiry() {
            const pDate = document.getElementById('prodDate').value;
            const sLife = document.getElementById('shelfLife').value;
            if (!pDate || !sLife) return;

            const match = sLife.match(/(\d+)\s*(个月|天|日|年|months?|days?|years?)/i);
            if (!match) return;

            let exp = new Date(pDate);
            const val = parseInt(match[1]);
            const unit = match[2];

            if (unit.includes('月') || unit.includes('month')) exp.setMonth(exp.getMonth() + val);
            else if (unit.includes('天') || unit.includes('日') || unit.includes('day')) exp.setDate(exp.getDate() + val);
            else if (unit.includes('年') || unit.includes('year')) exp.setFullYear(exp.getFullYear() + val);

            exp.setDate(exp.getDate() - 1);
            const yyyy = exp.getFullYear();
            const mm = String(exp.getMonth() + 1).padStart(2, '0');
            const dd = String(exp.getDate()).padStart(2, '0');
            
            document.getElementById('expDate').value = `${yyyy}-${mm}-${dd}`;
        }

        document.getElementById('prodDate').addEventListener('change', recalculateExpiry);
        document.getElementById('shelfLife').addEventListener('input', recalculateExpiry);

        async function saveToDatabase() {
            const name = document.getElementById('productName').value;
            let pDate = document.getElementById('prodDate').value;
            let sLife = document.getElementById('shelfLife').value.trim();
            const eDate = document.getElementById('expDate').value;
            const qty = document.getElementById('quantity').value || 1;
            const loc = document.getElementById('location').value.trim() || "Unassigned";

            // Removed the shelf life check here! Only Expiry Date is strictly required.
            if (!name) return alert("Please type a Product Name!");
            if (!eDate) return alert("Missing Expiry Date!"); 

            if (!pDate) pDate = "N/A";
            if (!sLife) sLife = "N/A"; // Defaults to N/A if you leave it blank

            const url = `/api/add?product_name=${encodeURIComponent(name)}&prod_date=${pDate}&shelf_life=${encodeURIComponent(sLife)}&exp_date=${eDate}&quantity=${qty}&location=${encodeURIComponent(loc)}`;
            
            const response = await fetch(url, { method: 'POST' });
            if (response.ok) {
                alert('✅ Saved successfully!');
                window.location.reload(); 
            } else {
                alert('❌ Failed to save.');
            }
        }
    </script>
</body>
</html>
