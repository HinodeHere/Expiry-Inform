<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍏 FreshTrack - Inventory</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --card-bg: white; --text-color: #333; 
            --shadow: rgba(0,0,0,0.1); --border-color: #ddd;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f4f4f9; 
            --shadow: rgba(0,0,0,0.5); --border-color: #444;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 800px; margin: auto; transition: background-color 0.3s, color 0.3s; }
        
        .header-container { display: flex; justify-content: flex-start; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .nav-btn { padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .nav-btn:hover { background: #5a6268; }
        
        .card { background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px var(--shadow); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; transition: background-color 0.3s;}
        
        .item-info { flex: 2; min-width: 200px; }
        .item-info h3 { margin: 0 0 5px 0; }
        .item-info p { margin: 2px 0; font-size: 14px; opacity: 0.8; }
        
        .qty-controls { display: flex; align-items: center; gap: 10px; background: var(--bg-color); padding: 5px; border-radius: 5px; border: 1px solid var(--border-color); transition: background-color 0.3s;}
        .qty-btn { background: transparent; color: var(--text-color); border: none; font-size: 18px; font-weight: bold; cursor: pointer; padding: 5px 10px; }
        .qty-display { font-weight: bold; min-width: 20px; text-align: center; }
        
        /* NEW BUTTON STYLES */
        .action-buttons { display: flex; gap: 10px; width: 100%; margin-top: 5px; }
        .btn-consume { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; }
        .btn-consume-all { background-color: #f63636; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; }
        .btn-consume:hover, .btn-consume-all:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('appTheme') || 'light');</script>

    <div class="header-container">
        <a href="/" class="nav-btn">⬅ Back to Dashboard</a>
        <h2 style="margin:0;">📦 Inventory</h2>
    </div>

    <div id="inventoryList">Loading...</div>

    <script>
        let globalItems = [];

        async function loadInventory() {
            const response = await fetch('/api/inventory');
            const data = await response.json();
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            
            globalItems = data.items;

            if (globalItems.length === 0) {
                list.innerHTML = '<p style="text-align:center;">Your inventory is empty!</p>';
                return;
            }

            globalItems.forEach(item => {
                const expDate = new Date(item.expiration_date);
                const daysLeft = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
                
                let statusColor = "green";
                let statusText = `${daysLeft} days left`;
                
                if (daysLeft < 0) { statusColor = "red"; statusText = "EXPIRED!"; }
                else if (daysLeft <= 3) { statusColor = "orange"; statusText = "Expiring Soon!"; }

                list.innerHTML += `
                    <div class="card">
                        <div class="item-info">
                            <h3>${item.product_name}</h3>
                            <p><b>Expires:</b> ${item.expiration_date} <span style="color:${statusColor}; font-weight:bold;">(${statusText})</span></p>
                            <p><b>Location:</b> ${item.location || 'Unassigned'}</p>
                        </div>
                        
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                            <span class="qty-display">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        </div>

                        <!-- NEW: Consume 1 & Consume All Buttons -->
                        <div class="action-buttons">
                            <button class="btn-consume" onclick="decrementItem(${item.id})">🍽️ Consume 1</button>
                            <button class="btn-consume-all" onclick="consumeItem(${item.id})">✔️ Consume All</button>
                        </div>
                    </div>
                `;
            });
        }

        async function updateQuantity(id, newQty) {
            newQty = parseInt(newQty);
            if (isNaN(newQty)) return loadInventory(); 

            const item = globalItems.find(i => i.id === id);
            const oldQty = item ? item.quantity : 1;

            if (newQty === 0 && !confirm("Quantity is 0. Mark this item as fully consumed?")) {
                return loadInventory();
            }

            let pin = localStorage.getItem('appPin');
            if (!pin) {
                pin = prompt("🔒 Enter App PIN to authorize this action:");
                if (!pin) {
                    loadInventory();
                    return; 
                }
                localStorage.setItem('appPin', pin);
            }

            try {
                const response = await fetch(`/api/update_quantity/${id}?quantity=${newQty}`, {
                    method: 'POST',
                    headers: { 'X-App-PIN': pin }
                });

                if (response.status === 401) {
                    localStorage.removeItem('appPin');
                    alert("❌ Incorrect PIN! Action blocked.");
                }
                loadInventory();
            } catch (err) {
                alert('❌ Network error.');
                loadInventory();
            }
        }

        // NEW: Decrement function to handle the "Consume 1" button
        async function decrementItem(id) {
            let pin = localStorage.getItem('appPin');
            if (!pin) {
                pin = prompt("🔒 Enter App PIN:");
                if (!pin) return;
                localStorage.setItem('appPin', pin);
            }

            try {
                const response = await fetch(`/api/decrement/${id}`, { method: 'POST', headers: { 'X-App-PIN': pin }});
                if (response.status === 401) {
                    localStorage.removeItem('appPin');
                    alert("❌ Incorrect PIN!");
                }
                loadInventory();
            } catch (err) {
                alert('❌ Network error.');
                loadInventory();
            }
        }

        async function consumeItem(id) {
            if (!confirm('Mark all of this item as consumed?')) return;
            
            let pin = localStorage.getItem('appPin');
            if (!pin) {
                pin = prompt("🔒 Enter App PIN:");
                if (!pin) return;
                localStorage.setItem('appPin', pin);
            }

            try {
                const response = await fetch(`/api/consume/${id}`, { method: 'POST', headers: { 'X-App-PIN': pin }});
                if (response.status === 401) {
                    localStorage.removeItem('appPin');
                    alert("❌ Incorrect PIN!");
                }
                loadInventory();
            } catch (err) {
                alert('❌ Network error.');
                loadInventory();
            }
        }

        window.onload = loadInventory;
    </script>
</body>
</html>
